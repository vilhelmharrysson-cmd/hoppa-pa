name: Uppdatera linjer

# Hämtar SL:s och Västtrafiks tidtabellsdata (GTFS Regional via Trafiklab) och bygger om alla turer
# i public/data. Körs varje natt, så att ändrade linjer och planerade omledningar kommer med.
# Kräver hemligheten TRAFIKLAB_KEY (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: "17 5 * * *"      # varje natt, efter att Trafiklab uppdaterat datan (03–07 svensk tid)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/data.yml"]

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta bilder till nya platser (Wikimedia Commons)
        run: python3 tools/wiki_images.py || echo "::warning::Bildhämtningen misslyckades, försöker igen nästa natt"
      - name: Hämta historiska foton (K-samsök)
        run: python3 tools/historic_images.py || echo "::warning::Historiska foton misslyckades, försöker igen nästa natt"
      - name: Datum för GTFS-cachen
        id: day
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: GTFS-filer (hämtas högst en gång per dygn, Trafiklab har en kvot)
        id: gtfs
        uses: actions/cache@v4
        with:
          path: ~/.gtfs
          key: gtfs-${{ steps.day.outputs.d }}
          restore-keys: gtfs-
      - name: Bygg turer från GTFS
        env:
          TRAFIKLAB_KEY: ${{ secrets.TRAFIKLAB_KEY }}
        run: |
          if [ -z "$TRAFIKLAB_KEY" ]; then
            echo "::error::Hemligheten TRAFIKLAB_KEY saknas. Lägg till den under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Dagens filer från cachen om de finns. Annars hämtas nya; svarar Trafiklab inte
          # (t.ex. kvoten slut) byggs turerna med senast hämtade filer.
          mkdir -p ~/.gtfs
          if [ "${{ steps.gtfs.outputs.cache-hit }}" != "true" ]; then
            rm -rf ~/.gtfs-prev && mv ~/.gtfs ~/.gtfs-prev && mkdir -p ~/.gtfs
            if ! python3 tools/gtfs_build.py --cache ~/.gtfs; then
              echo "::warning::Kunde inte hämta GTFS från Trafiklab, bygger med senast hämtade filer"
              git checkout -- public/data
              cp ~/.gtfs-prev/*.zip ~/.gtfs/ 2>/dev/null || true
              python3 tools/gtfs_build.py --cache ~/.gtfs
            fi
          else
            python3 tools/gtfs_build.py --cache ~/.gtfs
          fi
          python3 tools/lines_index.py
          python3 tools/enrich.py
      - name: Hämta Piper-röst (cache)
        uses: actions/cache@v4
        with:
          path: ~/.piper
          key: piper-voice-sv-en-v1
      - name: Spela in berättelser som saknar ljud (Piper)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet piper-tts
          mkdir -p ~/.piper && cd ~/.piper
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/sv/sv_SE
          if [ ! -f voice.onnx ]; then
            # Lisa om den finns, annars NST
            if curl -fsSL -o voice.onnx "$base/lisa/medium/sv_SE-lisa-medium.onnx" && curl -fsSL -o voice.onnx.json "$base/lisa/medium/sv_SE-lisa-medium.onnx.json"; then
              echo "sv_SE-lisa-medium" > name.txt
            else
              curl -fsSL -o voice.onnx "$base/nst/medium/sv_SE-nst-medium.onnx"
              curl -fsSL -o voice.onnx.json "$base/nst/medium/sv_SE-nst-medium.onnx.json"
              echo "sv_SE-nst-medium" > name.txt
            fi
          fi
          name=$(cat name.txt); cp voice.onnx "$name.onnx"; cp voice.onnx.json "$name.onnx.json"
          echo "Röst: $name"
          cd "$GITHUB_WORKSPACE"
          python3 tools/piper_audio.py ~/.piper/"$name".onnx --workers 4
          # engelska rösten
          enb=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium
          if [ ! -f ~/.piper/en_US-lessac-medium.onnx ]; then
            curl -fsSL -o ~/.piper/en_US-lessac-medium.onnx "$enb/en_US-lessac-medium.onnx"
            curl -fsSL -o ~/.piper/en_US-lessac-medium.onnx.json "$enb/en_US-lessac-medium.onnx.json"
          fi
          python3 tools/piper_audio.py ~/.piper/en_US-lessac-medium.onnx --workers 4 --lang en
      - name: Spara om något ändrats
        run: |
          git config user.name "hoppa-pa databygge"
          git config user.email "actions@users.noreply.github.com"
          git add public/data public/audio/piper public/audio/piper-en tools/places_extra.json
          if git diff --cached --quiet; then
            echo "Inga ändringar i linjerna."
          else
            git commit -m "Uppdatera linjer från GTFS ($(date -u +%Y-%m-%d))"
            git push
          fi
