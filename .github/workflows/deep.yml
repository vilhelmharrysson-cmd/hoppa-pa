name: Fördjupning (Wikipedia)

# Hämtar hela Wikipedia-artiklar för de mest trafikerade hållplatserna, som underlag för "Läs mer".

on:
  workflow_dispatch:
    inputs:
      top:
        description: "Antal hållplatser"
        default: "300"

permissions:
  contents: write

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta artiklar
        env:
          TOP: ${{ inputs.top }}
        run: python3 tools/deep_research.py
      - name: Spara
        run: |
          git config user.name "hoppa-pa faktainsamling"
          git config user.email "actions@users.noreply.github.com"
          git add tools/research
          git commit -m "Fördjupning från Wikipedia ($(date -u +%Y-%m-%d))" || exit 0
          git pull --rebase
          git push
