name: Realtid (undersökning)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet gtfs-realtime-bindings
      - env:
          TRAFIKLAB_SWEDEN3_RT_KEY: ${{ secrets.TRAFIKLAB_SWEDEN3_RT_KEY }}
        run: python3 tools/rt_probe.py
