[build]
  publish = "public"
  functions = "netlify/functions"

# Funktionerna /api/vt (Västtrafik) och /api/sl (SL) anger sina egna sökvägar i koden.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
