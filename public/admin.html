<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hoppa på – granskning</title>
<style>
:root{--bg:#f4f6f7;--surface:#fff;--ink:#0d2a33;--muted:#5b6f75;--line:#d8e0e2;--ok:#1d7a46;--no:#b3261e;--accent:#ffd23f}
@media (prefers-color-scheme:dark){:root{--bg:#0b1a1f;--surface:#13262c;--ink:#e6f0f1;--muted:#9bb0b5;--line:#24404a}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 16px}
h2{font-size:17px;margin:24px 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.no{color:var(--no)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.meta{color:var(--muted);font-size:13px}
.kind{display:inline-block;background:var(--accent);color:#1a1a1a;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;margin-right:6px}
.text{white-space:pre-wrap;margin:6px 0}
textarea{width:100%;box-sizing:border-box}
table{border-collapse:collapse;width:100%;background:var(--surface);border-radius:12px;overflow:hidden}
td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Hoppa på – granskning och statistik</h1>
  <div class="bar">
    <input id="key" type="password" placeholder="Admin-nyckel" autocomplete="current-password" aria-label="Admin-nyckel">
    <select id="status" aria-label="Visa">
      <option value="ny">Nya</option><option value="ok">Godkända (visas)</option><option value="klar">Åtgärdade</option><option value="nej">Avvisade</option>
    </select>
    <button id="load" type="button">Hämta</button>
    <span class="muted" id="msg"></span>
  </div>
  <div id="items"></div>
  <h2>Statistik, senaste 30 dagarna</h2>
  <div class="grid" id="stats"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const KIND={tips:"Tips",fel:"Fel",berattelse:"Berättelse",bild:"Bild",annat:"Annat"};
const EV={open:"Öppnade turer",start:"Startade simuleringar",gps:"Startade med GPS",offline:"Sparade offline",share:"Delningar",more:"Öppnade Läs mer",alight:"Säg till före",lang_en:"Engelska",kids:"Barnläge",theme:"Temarundor",train:"Valde sitt tåg"};
try{ $("key").value=localStorage.getItem("hp_admin")||""; }catch(e){}
async function api(method,body){
  const k=$("key").value; try{ localStorage.setItem("hp_admin",k); }catch(e){}
  const r=await fetch("/api/admin"+(method==="GET"?"?status="+$("status").value:""),{method,headers:{"x-admin-key":k,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:"svar saknas ("+r.status+")"}));
  if(!r.ok) throw new Error(j.error||r.status);
  return j;
}
function table(title,rows,label){
  const box=document.createElement("div");
  const h=document.createElement("b"); h.textContent=title; box.append(h);
  const t=document.createElement("table");
  rows.forEach(r=>{ const tr=document.createElement("tr"); const a=document.createElement("td"); a.textContent=label(r); const b=document.createElement("td"); b.className="n"; b.textContent=r.n; tr.append(a,b); t.append(tr); });
  if(!rows.length){ const tr=document.createElement("tr"); const a=document.createElement("td"); a.textContent="Inget ännu"; a.className="muted"; tr.append(a); t.append(tr); }
  box.append(t); return box;
}
async function load(){
  $("msg").textContent="Hämtar…";
  try{
    const j=await api("GET");
    $("msg").textContent=j.counts.map(c=>c.status+": "+c.n).join(" · ");
    const box=$("items"); box.textContent="";
    if(!j.items.length){ const p=document.createElement("p"); p.className="muted"; p.textContent="Inga bidrag här."; box.append(p); }
    j.items.forEach(it=>{
      const c=document.createElement("div"); c.className="card";
      const m=document.createElement("div"); m.className="meta";
      const k=document.createElement("span"); k.className="kind"; k.textContent=KIND[it.kind]||it.kind;
      m.append(k, document.createTextNode([it.city,it.stop,it.tour,new Date(it.created).toLocaleString("sv-SE")].filter(Boolean).join(" · ")+(it.contact?" · "+it.contact:"")));
      const t=document.createElement("div"); t.className="text"; t.textContent=it.text;
      c.append(m,t);
      let edit=null;
      if(it.kind==="tips"){
        edit=document.createElement("textarea"); edit.rows=2; edit.value=it.reply||it.text; edit.setAttribute("aria-label","Text som visas i appen");
        const l=document.createElement("div"); l.className="meta"; l.textContent="Text som visas i appen om du godkänner (kan redigeras):";
        c.append(l,edit);
      }
      const bar=document.createElement("div"); bar.className="bar";
      const act=(label,status,cls)=>{ const b=document.createElement("button"); b.type="button"; b.textContent=label; if(cls) b.className=cls;
        b.onclick=async()=>{ b.disabled=true; try{ await api("POST",{id:it.id,status,reply:edit?edit.value:null}); c.remove(); }catch(e){ b.disabled=false; alert(e.message); } }; bar.append(b); };
      if(it.kind==="tips") act("Godkänn och visa","ok","ok"); else act("Markera åtgärdad","klar","ok");
      act("Avvisa","nej","no");
      if(it.status!=="ny") act("Tillbaka till nya","ny");
      c.append(bar); box.append(c);
    });
    const s=$("stats"); s.textContent="";
    s.append(table("Händelser",j.stats.byEv,r=>EV[r.ev]||r.ev));
    s.append(table("Mest öppnade turer",j.stats.topTours,r=>r.tour));
    s.append(table("Öppnade turer per dag",j.stats.byDay.slice().reverse(),r=>r.day));
  }catch(e){ $("msg").textContent="Fel: "+e.message; }
}
$("load").onclick=load; $("status").onchange=load;
if($("key").value) load();
</script>
</body>
</html>
